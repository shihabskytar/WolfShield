[package]
name = "wolfshield"
version = "0.1.0"
edition = "2021"

[lib]
name = "wolfshield_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
